name: Dot Race CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  PIPELINE_NAME: dotrace-game-pipeline

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: |
          unset NPM_TOKEN NODE_AUTH_TOKEN || true
          npm config set registry https://registry.npmjs.org/
          npm ci

      - name: Test CDK
        working-directory: infra/cdk
        run: npm test

      - name: Synth CDK
        working-directory: infra/cdk
        run: npx cdk synth

      - name: Build Angular
        run: npm run build --workspace=frontend/dotrace-app

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Start CodePipeline
        id: pipeline
        run: |
          EXEC_ID=$(aws codepipeline start-pipeline-execution \
            --name "$PIPELINE_NAME" \
            --region "$AWS_REGION" \
            --query pipelineExecutionId \
            --output text)
          echo "execution_id=$EXEC_ID" >> "$GITHUB_OUTPUT"
          echo "Started pipeline execution $EXEC_ID"

      - name: Wait for deployment
        run: |
          EXEC_ID="${{ steps.pipeline.outputs.execution_id }}"
          echo "Waiting for $PIPELINE_NAME execution $EXEC_ID …"
          for i in $(seq 1 90); do
            STATUS=$(aws codepipeline get-pipeline-execution \
              --pipeline-name "$PIPELINE_NAME" \
              --pipeline-execution-id "$EXEC_ID" \
              --region "$AWS_REGION" \
              --query pipelineExecution.status \
              --output text)
            echo "Attempt $i/90: $STATUS"
            case "$STATUS" in
              Succeeded)
                echo "Deployment succeeded."
                exit 0
                ;;
              Failed|Cancelled|Superseded|Stopped)
                echo "Deployment failed with status: $STATUS"
                exit 1
                ;;
            esac
            sleep 30
          done
          echo "Timed out waiting for pipeline execution."
          exit 1
