name: Dot Race CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  PIPELINE_NAME: dotrace-game-pipeline

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: |
          unset NPM_TOKEN NODE_AUTH_TOKEN || true
          npm config set registry https://registry.npmjs.org/
          npm ci

      - name: Test CDK
        working-directory: infra/cdk
        run: npm test

      - name: Synth CDK
        working-directory: infra/cdk
        run: npx cdk synth

      - name: Build Angular
        run: npm run build --workspace=frontend/dotrace-app

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-main
      cancel-in-progress: false
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Start CodePipeline
        id: pipeline
        run: |
          EXEC_ID=$(aws codepipeline start-pipeline-execution \
            --name "$PIPELINE_NAME" \
            --region "$AWS_REGION" \
            --query pipelineExecutionId \
            --output text)
          echo "execution_id=$EXEC_ID" >> "$GITHUB_OUTPUT"
          echo "Started pipeline execution $EXEC_ID"

      - name: Wait for deployment
        run: |
          EXEC_ID="${{ steps.pipeline.outputs.execution_id }}"
          echo "Waiting for $PIPELINE_NAME execution $EXEC_ID …"
          for i in $(seq 1 90); do
            STATE=$(aws codepipeline get-pipeline-state \
              --name "$PIPELINE_NAME" \
              --region "$AWS_REGION" \
              --output json)

            FAILED_STAGE=$(echo "$STATE" | jq -r --arg id "$EXEC_ID" '
              [.stageStates[]
                | select(.latestExecution.pipelineExecutionId == $id)
                | select(.latestExecution.status | IN("Failed", "Stopped", "Cancelled"))
                | .stageName][0] // empty')
            if [ -n "$FAILED_STAGE" ]; then
              echo "Deployment failed in stage: $FAILED_STAGE"
              echo "Action details for failed stage:"
              echo "$STATE" | jq -r --arg stage "$FAILED_STAGE" '
                .stageStates[]
                | select(.stageName == $stage)
                | .actionStates[]
                | "  action=\(.actionName)"
                  + " status=\(.latestExecution.status // "n/a")"
                  + (if .latestExecution.errorDetails
                     then " error=[\(.latestExecution.errorDetails.code // "?")] \(.latestExecution.errorDetails.message // "?")"
                     else "" end)'
              exit 1
            fi

            LAST_EXEC=$(echo "$STATE" | jq -r '.stageStates[-1].latestExecution.pipelineExecutionId // empty')
            LAST_STATUS=$(echo "$STATE" | jq -r '.stageStates[-1].latestExecution.status // empty')
            echo "Attempt $i/90: final stage execution=${LAST_EXEC:-none} status=${LAST_STATUS:-none}"
            if [ "$LAST_EXEC" = "$EXEC_ID" ] && [ "$LAST_STATUS" = "Succeeded" ]; then
              echo "Deployment succeeded."
              exit 0
            fi
            sleep 20
          done
          echo "Timed out waiting for pipeline execution."
          exit 1
