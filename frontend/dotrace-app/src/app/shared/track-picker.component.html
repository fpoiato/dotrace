<div>
  <h2 class="mb-1 text-xs font-medium text-slate-400">{{ 'lobby.selectTrack' | translate }}</h2>
  <div class="mb-2 rounded-xl border-2 bg-slate-900/60 p-2" [class]="chosen ? 'border-orange-500' : 'border-slate-600'">
    <div class="flex items-center gap-2">
      <button
        type="button"
        (click)="prev()"
        class="flex h-11 w-11 shrink-0 items-center justify-center rounded-xl border-2 border-slate-600 text-xl text-white transition hover:border-slate-500"
        [attr.aria-label]="'lobby.prevTrack' | translate"
      >
        ‹
      </button>

      <button
        type="button"
        class="min-w-0 flex-1"
        (click)="chooseCurrent()"
        (touchstart)="onTouchStart($event)"
        (touchend)="onTouchEnd($event)"
        [attr.aria-label]="(current?.nameKey ?? 'lobby.selectTrack') | translate"
      >
        <canvas #preview class="h-40 w-full rounded-lg bg-slate-950"></canvas>
      </button>

      <button
        type="button"
        (click)="next()"
        class="flex h-11 w-11 shrink-0 items-center justify-center rounded-xl border-2 border-slate-600 text-xl text-white transition hover:border-slate-500"
        [attr.aria-label]="'lobby.nextTrack' | translate"
      >
        ›
      </button>
    </div>

    <div class="mt-2 flex items-center justify-between gap-2 px-1">
      <p class="truncate text-sm font-semibold" [class.text-orange-300]="chosen" [class.text-white]="!chosen">
        {{ (current?.nameKey ?? 'lobby.selectTrackPlaceholder') | translate }}
      </p>
      <p class="shrink-0 text-[11px] text-slate-400">{{ index + 1 }}/{{ tracks.length }}</p>
    </div>

    <div class="mt-2 flex justify-center gap-1.5" role="tablist" [attr.aria-label]="'lobby.selectTrack' | translate">
      @for (track of tracks; track track.id; let i = $index) {
        <button
          type="button"
          role="tab"
          (click)="go(i)"
          class="h-2.5 rounded-full transition"
          [class]="i === index ? 'w-6 bg-orange-500' : 'w-2.5 bg-slate-600'"
          [attr.aria-selected]="i === index"
          [attr.aria-label]="track.nameKey | translate"
        ></button>
      }
    </div>
  </div>
</div>
