<div class="mx-auto flex min-h-screen max-w-md flex-col px-4 py-6">
  <div class="mb-6 flex items-center justify-between">
    <div>
      <h1 class="text-3xl font-bold text-orange-400">{{ 'app.title' | translate }}</h1>
      <p class="mt-1 text-sm text-slate-400">{{ 'app.subtitle' | translate }}</p>
    </div>
    <app-language-toggle />
  </div>

  <div class="flex flex-1 flex-col justify-center gap-4">
    <label class="block">
      <span class="mb-2 block text-sm font-medium text-slate-300">{{ 'landing.nickname' | translate }}</span>
      <input
        type="text"
        maxlength="20"
        [(ngModel)]="nickname"
        [placeholder]="'landing.nicknamePlaceholder' | translate"
        class="min-h-14 w-full rounded-xl border border-slate-600 bg-slate-800 px-4 text-lg text-white placeholder-slate-500 focus:border-orange-500 focus:outline-none"
      />
    </label>

    @if (!showJoin) {
      <button
        type="button"
        (click)="createGame()"
        [disabled]="loading || !nickname.trim()"
        class="min-h-14 w-full rounded-xl bg-orange-500 text-lg font-bold text-white transition hover:bg-orange-600 disabled:opacity-50"
      >
        {{ loading ? ('landing.creating' | translate) : ('landing.createGame' | translate) }}
      </button>
      <button
        type="button"
        (click)="openJoin()"
        [disabled]="loading || !nickname.trim()"
        class="min-h-14 w-full rounded-xl border-2 border-orange-500 bg-transparent text-lg font-bold text-orange-400 transition hover:bg-orange-500/10 disabled:opacity-50"
      >
        {{ 'landing.joinGame' | translate }}
      </button>
    } @else {
      <label class="block">
        <span class="mb-2 block text-sm font-medium text-slate-300">{{ 'landing.roomCode' | translate }}</span>
        <input
          type="text"
          maxlength="5"
          [(ngModel)]="roomCode"
          class="min-h-14 w-full rounded-xl border border-slate-600 bg-slate-800 px-4 text-center text-2xl font-mono uppercase tracking-widest text-white focus:border-orange-500 focus:outline-none"
        />
      </label>
      <button
        type="button"
        (click)="joinGame()"
        [disabled]="loading || !nickname.trim() || roomCode.trim().length !== 5"
        class="min-h-14 w-full rounded-xl bg-orange-500 text-lg font-bold text-white transition hover:bg-orange-600 disabled:opacity-50"
      >
        {{ loading ? ('landing.joining' | translate) : ('landing.enter' | translate) }}
      </button>
      <button
        type="button"
        (click)="back()"
        class="min-h-12 w-full rounded-xl text-slate-400 hover:text-white"
      >
        {{ 'landing.back' | translate }}
      </button>
    }

    @if (error) {
      <p class="rounded-lg bg-red-900/50 px-4 py-3 text-center text-red-200">{{ error }}</p>
    }

    <button
      type="button"
      (click)="showHowTo = true"
      class="min-h-11 text-sm text-slate-400 underline underline-offset-4 hover:text-white"
    >
      {{ 'howto.link' | translate }}
    </button>
  </div>
</div>

@if (showHowTo) {
  <app-how-to-play (close)="showHowTo = false" />
}
